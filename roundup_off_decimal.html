<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際戰機 - 經典與答題模式挑戰與積分商店</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none;
            user-select: none;
            background: #050515;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #101026 0%, #020208 100%);
        }
    </style>
</head>
<body class="text-white h-[100dvh] w-[100vw] flex flex-col items-center justify-between relative select-none overflow-hidden">

    <div id="hud" class="absolute top-2 left-2 right-2 flex justify-between items-center pointer-events-none z-10 px-2 text-[10px] md:text-sm pixel-font text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.6)]">
        <div class="pointer-events-auto flex items-center gap-1.5 md:gap-3 flex-wrap">
            <div>分數: <span id="scoreVal">0</span></div>
            <div class="hidden sm:block">最高: <span id="highScoreHudVal" class="text-yellow-400">0</span></div>
            <div>金幣: <span id="coinVal" class="text-yellow-400">🪙 0</span></div>
            <div class="hidden md:block">時間: <span id="timeVal" class="text-green-400">00:00</span></div>
            <button id="classicMenuBtn" class="hidden bg-slate-800/80 hover:bg-slate-700 text-cyan-300 border border-cyan-500/50 px-2 py-0.5 rounded text-[9px] md:text-xs cursor-pointer">返回主頁</button>
        </div>
        <div class="flex items-center gap-1 pointer-events-auto">
            <span class="hidden sm:inline">生命:</span>
            <div id="livesContainer" class="flex gap-0.5 text-red-500 text-xs">❤ ❤ ❤️️</div>
        </div>
        <div class="pointer-events-auto flex items-center gap-1.5 md:gap-2">
            <button id="bgmToggleBtn" class="bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/50 px-1.5 py-0.5 rounded text-[10px] md:text-xs cursor-pointer shadow-md">
                🎵 音樂: 開
            </button>
            <button id="soundToggleBtn" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/50 px-1.5 py-0.5 rounded text-[10px] md:text-xs cursor-pointer shadow-md">
                🔊 音效: 開
            </button>
            <button id="openShopBtn" class="bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 text-white px-2 py-0.5 rounded text-[10px] md:text-xs pixel-font shadow-md cursor-pointer">
                🛍️ 商店
            </button>
        </div>
    </div>

    <div class="relative w-full flex-1 flex items-center justify-center overflow-hidden">
        <canvas id="gameCanvas" class="w-full h-full"></canvas>

        <!-- Start Screen -->
        <div id="startScreen" class="absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center z-20 text-center p-4">
            <h1 class="pixel-font text-2xl md:text-5xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 mb-3 animate-pulse">星際戰機</h1>
            <p class="text-gray-300 mb-5 text-xs md:text-base max-w-md">支援電腦、iPad 與手機！手指滑動或滑鼠拖曳操控飛船。選擇經典射擊挑戰，或透過「Boss 答題射擊模式」挑戰四捨五入與應用短答題，發射飛彈擊中 Boss！</p>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm justify-center">
                <button id="startClassicBtn" class="pixel-font bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 text-white px-4 py-2.5 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.5)] text-xs md:text-sm cursor-pointer">
                    經典射擊模式
                </button>
                <button id="startQuizBtn" class="pixel-font bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-400 text-white px-4 py-2.5 rounded-xl shadow-[0_0_15px_rgba(168,85,247,0.5)] text-xs md:text-sm cursor-pointer">
                    Boss 答題射擊模式
                </button>
            </div>
            <div class="mt-3">
                <button id="startShopBtn" class="pixel-font bg-gradient-to-r from-yellow-500 to-amber-600 text-white px-4 py-2 rounded-xl text-xs cursor-pointer shadow-md">
                    🛍️ 開啟積分主題商店
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center z-20 text-center p-4 hidden">
            <h2 id="gameOverTitle" class="pixel-font text-2xl md:text-4xl text-red-500 mb-2 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">遊戲結束</h2>
            <div id="achievementBadgeContainer" class="my-1 flex flex-wrap gap-2 justify-center"></div>
            <p id="gameOverTipText" class="text-amber-300 mb-2 text-xs md:text-sm font-bold whitespace-pre-line"></p>
            <p class="text-gray-300 mb-1 text-base">最終得分: <span id="finalScore" class="text-cyan-400 pixel-font">0</span></p>
            <p class="text-gray-400 mb-4 text-xs">最高紀錄: <span id="highScore" class="text-yellow-400 pixel-font">0</span></p>
            <div class="flex gap-3">
                <button id="restartBtn" class="pixel-font bg-gradient-to-r from-red-500 to-pink-600 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm cursor-pointer">
                    再次挑戰
                </button>
                <button id="menuBtn" class="pixel-font bg-gradient-to-r from-gray-600 to-gray-700 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm cursor-pointer">
                    返回主選單
                </button>
            </div>
        </div>
    </div>

    <div id="quizHud" class="w-full bg-black/95 border-t-2 border-cyan-500/60 backdrop-blur-md px-4 py-3 z-30 hidden shadow-[0_-5px_25px_rgba(6,182,212,0.4)] flex flex-col items-center justify-center">
        <div class="flex justify-between items-center w-full max-w-4xl mb-1 text-[11px] md:text-sm font-bold">
            <div id="bossHpContainer" class="text-red-400">階段 Boss 血量: 5 / 5</div>
            <div class="flex items-center gap-2">
                <button id="hintBtn" class="bg-gradient-to-r from-amber-500 to-yellow-600 text-white px-2 py-0.5 rounded text-[10px] md:text-xs pixel-font shadow-md cursor-pointer flex items-center gap-1">
                    💡 提示
                </button>
                <div id="stageTitle" class="text-cyan-300">階段一：應用短答題挑戰</div>
            </div>
        </div>
        <div id="questionText" class="text-white text-sm md:text-lg font-bold tracking-wide py-1 text-center w-full max-w-4xl">載入題目中...</div>
        
        <div id="optionsContainer" class="grid grid-cols-2 gap-2 mt-1 w-full max-w-2xl hidden"></div>

        <div id="inputContainer" class="flex gap-2 mt-1 w-full max-w-md hidden">
            <input type="text" id="answerInput" placeholder="請在此輸入答案 (例如: 58.2 或 12.5)" class="flex-1 bg-slate-900 border-2 border-cyan-500/70 rounded-lg px-3 py-1.5 text-white text-xs md:text-sm focus:outline-none focus:border-cyan-400">
            <button id="submitAnswerBtn" class="pixel-font bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-4 py-1.5 rounded-lg text-xs shadow-lg cursor-pointer">
                送出
            </button>
        </div>
    </div>

    <div id="shopModal" class="absolute inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 hidden p-3">
        <div class="bg-slate-900 border-2 border-yellow-500 p-4 md:p-6 rounded-2xl max-w-3xl w-full shadow-[0_0_40px_rgba(245,158,11,0.6)] flex flex-col items-center">
            <div class="flex justify-between items-center w-full mb-3">
                <h3 class="pixel-font text-yellow-400 text-xs md:text-base">🛍️ 星際積分主題商店</h3>
                <div class="text-xs md:text-sm font-bold text-yellow-300">金幣: <span id="shopCoinVal">🪙 0</span></div>
            </div>

            <div class="w-full max-h-[55vh] overflow-y-auto space-y-3 pr-1">
                <div>
                    <h4 class="text-cyan-400 text-xs font-bold mb-1.5">🚀 飛船外觀解鎖</h4>
                    <div id="shipShopList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2"></div>
                </div>
                <div>
                    <h4 class="text-purple-400 text-xs font-bold mb-1.5">🌌 太空背景主題解鎖</h4>
                    <div id="bgShopList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2"></div>
                </div>
            </div>

            <button id="closeShopBtn" class="mt-4 pixel-font bg-gradient-to-r from-yellow-500 to-amber-600 text-white px-5 py-2 rounded-xl text-xs shadow-lg cursor-pointer">
                關閉商店
            </button>
        </div>
    </div>

    <div id="hintModal" class="absolute inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 hidden p-3">
        <div class="bg-slate-900 border-2 border-amber-500 p-4 rounded-2xl max-w-lg w-full text-center shadow-[0_0_40px_rgba(245,158,11,0.6)] flex flex-col items-center">
            <h3 class="pixel-font text-amber-400 text-xs md:text-sm mb-2">💡 四捨五入學習重點指南</h3>
            <div class="w-full max-h-[50vh] overflow-hidden rounded-xl border border-amber-500/50 mb-3 bg-black flex justify-center items-center">
                <img src="四捨五入.jpg" alt="四捨五入提示圖" id="hintImgEl" class="max-w-full max-h-[45vh] object-contain rounded-lg" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800&auto=format&fit=crop&q=80';">
            </div>
            <p class="text-[11px] text-gray-300 mb-3">提示口訣：<strong>取至幾分位就要計多 1 行</strong>（十分位、百分位與千分位運算要點！）</p>
            <button id="closeHintBtn" class="pixel-font bg-gradient-to-r from-amber-500 to-yellow-600 text-white px-5 py-2 rounded-xl text-xs shadow-lg cursor-pointer">
                關閉提示
            </button>
        </div>
    </div>

    <div id="messageModal" class="absolute inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-40 hidden p-4">
        <div class="bg-gray-900 border-2 border-red-500 p-5 rounded-2xl max-w-sm w-full text-center shadow-[0_0_30px_rgba(239,68,68,0.6)]">
            <h3 id="modalTitle" class="pixel-font text-red-400 text-base mb-2">回答錯誤！</h3>
            <p id="modalMessage" class="text-gray-200 text-xs md:text-sm mb-4 leading-relaxed whitespace-pre-line"></p>
            <button id="modalCloseBtn" class="pixel-font bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-5 py-2.5 rounded-xl shadow-lg cursor-pointer text-xs">
                確定，繼續挑戰
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Web Audio Sound Engine
        let audioCtx = null;
        let soundEnabled = true;
        let bgmEnabled = true;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const SoundFX = {
            playLaser() {
                if (!soundEnabled) return;
                initAudio();
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.12);
                } catch(e) {}
            },
            playExplosion() {
                if (!soundEnabled) return;
                initAudio();
                try {
                    let bufferSize = audioCtx.sampleRate * 0.3;
                    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    let data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    let noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    let filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(600, audioCtx.currentTime);
                    filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    let gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start();
                } catch(e) {}
            },
            playHit() {
                if (!soundEnabled) return;
                initAudio();
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } catch(e) {}
            },
            playCorrect() {
                if (!soundEnabled) return;
                initAudio();
                try {
                    let now = audioCtx.currentTime;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(880, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } catch(e) {}
            },
            playWrong() {
                if (!soundEnabled) return;
                initAudio();
                try {
                    let now = audioCtx.currentTime;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.setValueAtTime(140, now + 0.15);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch(e) {}
            }
        };

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            const notes = [220, 246.94, 277.18, 329.63, 392.00, 440];
            let noteIdx = 0;
            bgmInterval = setInterval(() => {
                if (!bgmEnabled || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[noteIdx % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    noteIdx++;
                } catch(e) {}
            }, 300);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        const soundToggleBtn = document.getElementById('soundToggleBtn');
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggleBtn.textContent = soundEnabled ? '🔊 音效: 開' : '🔇 音效: 關';
        });

        const bgmToggleBtn = document.getElementById('bgmToggleBtn');
        bgmToggleBtn.addEventListener('click', () => {
            bgmEnabled = !bgmEnabled;
            bgmToggleBtn.textContent = bgmEnabled ? '🎵 音樂: 開' : '🔇 音樂: 關';
            if (bgmEnabled && gameState === 'PLAYING') {
                startBGM();
            } else {
                stopBGM();
            }
        });

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startClassicBtn = document.getElementById('startClassicBtn');
        const startQuizBtn = document.getElementById('startQuizBtn');
        const startShopBtn = document.getElementById('startShopBtn');
        const openShopBtn = document.getElementById('openShopBtn');
        const shopModal = document.getElementById('shopModal');
        const closeShopBtn = document.getElementById('closeShopBtn');
        const shopCoinVal = document.getElementById('shopCoinVal');
        const shipShopList = document.getElementById('shipShopList');
        const bgShopList = document.getElementById('bgShopList');

        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');
        const classicMenuBtn = document.getElementById('classicMenuBtn');
        const scoreValEl = document.getElementById('scoreVal');
        const highScoreHudValEl = document.getElementById('highScoreHudVal');
        const coinValEl = document.getElementById('coinVal');
        const timeValEl = document.getElementById('timeVal');
        const quizHud = document.getElementById('quizHud');
        const stageTitleEl = document.getElementById('stageTitle');
        const questionTextEl = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const inputContainer = document.getElementById('inputContainer');
        const answerInput = document.getElementById('answerInput');
        const submitAnswerBtn = document.getElementById('submitAnswerBtn');
        const bossHpContainer = document.getElementById('bossHpContainer');
        const livesContainer = document.getElementById('livesContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const highScoreEl = document.getElementById('highScore');
        const gameOverTitleEl = document.getElementById('gameOverTitle');
        const gameOverTipText = document.getElementById('gameOverTipText');
        const achievementBadgeContainer = document.getElementById('achievementBadgeContainer');
        const messageModal = document.getElementById('messageModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const hintBtn = document.getElementById('hintBtn');
        const hintModal = document.getElementById('hintModal');
        const closeHintBtn = document.getElementById('closeHintBtn');

        let gameState = 'START';
        let gameMode = 'CLASSIC';
        let score = 0;
        let coins = parseInt(localStorage.getItem('space_shooter_coins')) || 100;
        let lives = 3;
        let highScore = parseInt(localStorage.getItem('space_shooter_high')) || 0;
        let gameTime = 0;
        let elapsedSeconds = 0;
        let lastBossSpawnMinute = 0;
        let triggeredScoreBosses = { 100: false, 1500: false, 2000: false, 2500: false };

        let hasAchievement15k = localStorage.getItem('space_shooter_ach_15k') === 'true';
        let hasAchievement10min = localStorage.getItem('space_shooter_ach_10min') === 'true';

        let currentStage = 1;
        let questionIndex = 0;
        let currentQuestion = null;
        let boss = null;
        let sessionQuestions = { stage1: [], stage2: [], stage3: [], stage4: [] };
        let lastMistakeTip = '';

        let player = null;
        let bullets = [];
        let homingMissiles = [];
        let enemies = [];
        let classicBosses = [];
        let enemyBullets = [];
        let particles = [];
        let stars = [];

        let shopData = {
            ships: [
                { id: 'default', name: '預設藍焰', price: 0, color: '#06b6d4', unlocked: true },
                { id: 'pink', name: '極光粉紅', price: 80, color: '#ec4899', unlocked: false },
                { id: 'gold', name: '黃金霸權', price: 150, color: '#eab308', unlocked: false },
                { id: 'emerald', name: '翠綠雷電', price: 200, color: '#10b981', unlocked: false },
                { id: 'crimson', name: '赤紅地獄', price: 250, color: '#ef4444', unlocked: false },
                { id: 'obsidian', name: '黑曜幻影', price: 350, color: '#8b5cf6', unlocked: false }
            ],
            backgrounds: [
                { id: 'default', name: '深空星海', price: 0, gradient: ['#101026', '#020208'], unlocked: true },
                { id: 'purple', name: '星雲紫氣', price: 80, gradient: ['#2e1065', '#090314'], unlocked: false },
                { id: 'matrix', name: '駭客矩陣', price: 150, gradient: ['#022c22', '#01110e'], unlocked: false },
                { id: 'sunset', name: '日落星河', price: 200, gradient: ['#7c2d12', '#180703'], unlocked: false },
                { id: 'cyberpunk', name: '霓虹賽博', price: 250, gradient: ['#831843', '#0f051d'], unlocked: false },
                { id: 'arctic', name: '極地冰川', price: 350, gradient: ['#0f172a', '#020617'], unlocked: false }
            ]
        };

        let savedShop = JSON.parse(localStorage.getItem('space_shooter_shop'));
        if (savedShop) {
            if (savedShop.ships) {
                shopData.ships.forEach(s => {
                    let found = savedShop.ships.find(x => x.id === s.id);
                    if (found) s.unlocked = found.unlocked;
                });
            }
            if (savedShop.backgrounds) {
                shopData.backgrounds.forEach(b => {
                    let found = savedShop.backgrounds.find(x => x.id === b.id);
                    if (found) b.unlocked = found.unlocked;
                });
            }
        }
        let currentShip = localStorage.getItem('space_shooter_equipped_ship') || 'default';
        let currentBg = localStorage.getItem('space_shooter_equipped_bg') || 'default';

        function saveShopState() {
            localStorage.setItem('space_shooter_shop', JSON.stringify(shopData));
            localStorage.setItem('space_shooter_coins', coins);
            localStorage.setItem('space_shooter_equipped_ship', currentShip);
            localStorage.setItem('space_shooter_equipped_bg', currentBg);
        }

        function renderShop() {
            shopCoinVal.textContent = `🪙 ${coins}`;
            coinValEl.textContent = `🪙 ${coins}`;

            shipShopList.innerHTML = '';
            shopData.ships.forEach(ship => {
                const isEquipped = currentShip === ship.id;
                const div = document.createElement('div');

        class Player {
            constructor() {
                this.width = 45;
                this.height = 40;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 70;
                this.speed = 8;
                this.shootTimer = 0;
                this.shootInterval = 12;
                this.invulnerableTimer = 0;
            }

            update() {
                if (gameMode === 'CLASSIC') {
                    if (keys.ArrowLeft) this.x -= this.speed;
                    if (keys.ArrowRight) this.x += this.speed;

                    if (touchX !== null) {
                        const dx = touchX - (this.x + this.width / 2);
                        this.x += dx * 0.25;
                    } else if (isMouseDown && mouseX !== undefined) {
                        const dx = mouseX - (this.x + this.width / 2);
                        this.x += dx * 0.2;
                    }

                    if (this.x < 10) this.x = 10;
                    if (this.x > canvas.width - this.width - 10) this.x = canvas.width - this.width - 10;

                    this.shootTimer++;
                    if (this.shootTimer >= this.shootInterval || keys.Space) {
                        this.shoot();
                        this.shootTimer = 0;
                    }
                } else {
                    this.x = canvas.width / 2 - this.width / 2;
                    this.y = canvas.height - 70;
                }

                if (this.invulnerableTimer > 0) this.invulnerableTimer--;
            }

            shoot() {
                let bulletColor = '#22d3ee';
                let foundShip = shopData.ships.find(s => s.id === currentShip);
                if (foundShip) bulletColor = foundShip.color;
                bullets.push(new Bullet(this.x + this.width / 2 - 3, this.y, 0, -14, bulletColor));
                SoundFX.playLaser();
            }

            draw() {
                if (this.invulnerableTimer > 0 && Math.floor(gameTime / 4) % 2 === 0) return;

                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.arc(0, this.height / 2 + 2, Math.sin(gameTime * 0.3) * 3 + 5, 0, Math.PI * 2);
                ctx.fill();

                let shipColor = '#06b6d4';
                let foundShip = shopData.ships.find(s => s.id === currentShip);
                if (foundShip) shipColor = foundShip.color;

                ctx.fillStyle = shipColor;
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.lineTo(0, this.height / 3);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.ellipse(0, -2, 4, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class HomingMissile {
            constructor(x, y, targetX, targetY, onHit) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 14;
                this.onHit = onHit;
                let bulletColor = '#22d3ee';
                let foundShip = shopData.ships.find(s => s.id === currentShip);
                if (foundShip) bulletColor = foundShip.color;
                this.color = bulletColor;
            }

            update() {
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist < this.speed) {
                    this.x = this.targetX;
                    this.y = this.targetY;
                    if (this.onHit) this.onHit();
                    return true;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                    return false;
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function shuffleArray(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function initSessionQuestions() {
            let s1 = shuffleArray(rawStage1Bank).slice(0, 5);
            let s2 = shuffleArray(rawStage2Bank).slice(0, 5);
            let s3 = shuffleArray(rawStage3Bank).slice(0, 5);

            let s4_1 = shuffleArray(rawStage1Bank).slice(0, 3);
            let s4_2 = shuffleArray(rawStage2Bank).slice(0, 3);
            let s4_3 = shuffleArray(rawStage3Bank).slice(0, 3);
            let s4_extra = shuffleArray(rawStage4Bank).slice(0, 1);
            let s4 = shuffleArray([...s4_1, ...s4_2, ...s4_3, ...s4_extra]);

            sessionQuestions = {
                stage1: s1,
                stage2: s2,
                stage3: s3,
                stage4: s4
            };
        }

        function loadQuestion() {
            let bankKey = `stage${currentStage}`;
            let currentBank = sessionQuestions[bankKey];
            let totalStageQuestions = currentStage === 4 ? 10 : 5;

            if (!currentBank || questionIndex >= currentBank.length) {
                if (currentStage < 4) {
                    currentStage++;
                    questionIndex = 0;
                    showModal('階段完成！', `恭喜通過階段 ${currentStage - 1}！即將進入階段 ${currentStage}（共 10 題挑戰）。`, () => {
                        boss = new QuizBoss();
                        boss.maxHp = currentStage === 4 ? 10 : 5;
                        boss.hp = boss.maxHp;
                        loadQuestion();
                    });
                    return;
                } else {
                    gameState = 'GAMEOVER';
                    stopBGM();
                    SoundFX.playCorrect();
                    gameOverTitleEl.textContent = '🎉 恭喜通關！';
                    gameOverTipText.textContent = `太厲害了！你成功擊敗了所有 Boss 並精通所有高難度四捨五入！`;
                    finalScoreEl.textContent = score;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('space_shooter_high', highScore);
                    }
                    highScoreEl.textContent = highScore;
                    quizHud.classList.add('hidden');
                    gameOverScreen.classList.remove('hidden');
                    return;
                }
            }

            currentQuestion = currentBank[questionIndex];
            let totalQ = currentStage === 4 ? 10 : 5;
            bossHpContainer.textContent = `階段 ${currentStage} Boss 血量: ${boss ? boss.hp : totalQ} / ${totalQ}`;
            
            let stageNames = ['', '一', '二', '三', '四'];
            stageTitleEl.textContent = `階段${stageNames[currentStage]}：答題挑戰 (第 ${questionIndex + 1}/${totalQ} 題)`;
            questionTextEl.textContent = currentQuestion.q;

            if (currentQuestion.options) {
                inputContainer.classList.add('hidden');
                optionsContainer.classList.remove('hidden');
                optionsContainer.innerHTML = '';
                let shuffledOpts = shuffleArray(currentQuestion.options);
                shuffledOpts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'pixel-font bg-slate-800 hover:bg-slate-700 border-2 border-cyan-500/60 text-cyan-200 py-2.5 px-3 rounded-xl text-xs shadow-lg cursor-pointer transition-all';
                    btn.textContent = opt;
                    btn.onclick = () => submitAnswer(opt);
                    optionsContainer.appendChild(btn);
                });
            } else {
                optionsContainer.classList.add('hidden');
                inputContainer.classList.remove('hidden');
                answerInput.value = '';
                answerInput.focus();
            }
        }

        submitAnswerBtn.onclick = () => {
            if (currentQuestion && !currentQuestion.options) {
                submitAnswer(answerInput.value.trim());
            }
        };

        answerInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                submitAnswer(answerInput.value.trim());
            }
        });

        function submitAnswer(userAns) {
            if (!currentQuestion) return;
            let isCorrect = false;
            if (userAns.toLowerCase() === currentQuestion.correct.toLowerCase()) {
                isCorrect = true;
            }

            if (isCorrect) {
                SoundFX.playCorrect();
                score += 200;
                coins += 10;
                saveShopState();
                scoreValEl.textContent = score;
                coinValEl.textContent = `🪙 ${coins}`;

                let totalQ = currentStage === 4 ? 10 : 5;

                if (boss && player) {
                    homingMissiles.push(new HomingMissile(
                        player.x + player.width / 2,
                        player.y,
                        boss.x + boss.width / 2,
                        boss.y + boss.height / 2,
                        () => {
                            boss.hp--;
                            bossHpContainer.textContent = `階段 ${currentStage} Boss 血量: ${boss.hp} / ${totalQ}`;
                            createExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, '#22c55e');
                            if (boss.hp <= 0) {
                                boss = null;
                            }
                        }
                    ));
                }

                questionIndex++;
                if (boss === null && questionIndex < totalQ) {
                    boss = new QuizBoss();
                    boss.maxHp = totalQ;
                    boss.hp = totalQ - questionIndex;
                }
                loadQuestion();
            } else {
                SoundFX.playWrong();
                lastMistakeTip = currentQuestion.tip || `正確答案是: ${currentQuestion.correct}`;
                lives--;
                updateHUD();
                if (lives <= 0) {
                    gameOver();
                } else {
                    showModal('回答錯誤！', `正確答案是: ${currentQuestion.correct}\n\n💡 提示：${lastMistakeTip}`);
                }
            }
        }

        function showModal(title, msg, callback) {
            modalTitle.textContent = title;
            modalMessage.textContent = msg;
            messageModal.classList.remove('hidden');
            modalCloseBtn.onclick = () => {
                messageModal.classList.add('hidden');
                if (callback) callback();
            };
        }

        function updateHUD() {
            scoreValEl.textContent = score;
            highScoreHudValEl.textContent = highScore;
            coinValEl.textContent = `🪙 ${coins}`;
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️ ';
            livesContainer.textContent = hearts;
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            stopBGM();
            SoundFX.playHit();
            quizHud.classList.add('hidden');
            gameOverTitleEl.textContent = '遊戲結束';
            gameOverTipText.textContent = gameMode === 'QUIZ' ? `💡 錯題重點複習：\n${lastMistakeTip || '多練習十分位與百分位的四捨五入口訣！'}` : '經典射擊挑戰完畢！';
            finalScoreEl.textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('space_shooter_high', highScore);
            }
            highScoreEl.textContent = highScore;

            achievementBadgeContainer.innerHTML = '';
            let badgesHTML = '';
            if (score >= 15000 && !hasAchievement15k) {
                hasAchievement15k = true;
                localStorage.setItem('space_shooter_ach_15k', 'true');
                badgesHTML += `<div class="bg-yellow-500/20 border border-yellow-400 text-yellow-300 px-3 py-1 rounded-full text-xs font-bold animate-bounce">🏆 獲得成就：萬五分成就達成獎牌！</div>`;
            } else if (hasAchievement15k) {
                badgesHTML += `<div class="bg-yellow-500/20 border border-yellow-400 text-yellow-300 px-3 py-1 rounded-full text-xs font-bold">🏆 已解鎖：萬五分成就達成獎牌</div>`;
            }

            if (elapsedSeconds >= 600 && !hasAchievement10min) {
                hasAchievement10min = true;
                coins += 1000;
                saveShopState();
                localStorage.setItem('space_shooter_ach_10min', 'true');
                badgesHTML += `<div class="bg-purple-500/20 border border-purple-400 text-purple-300 px-3 py-1 rounded-full text-xs font-bold animate-bounce">🛡️ 生存大師達成：獎勵隱藏 1000 金幣！</div>`;
            } else if (hasAchievement10min) {
                badgesHTML += `<div class="bg-purple-500/20 border border-purple-400 text-purple-300 px-3 py-1 rounded-full text-xs font-bold">🛡️ 已解鎖：生存大師 (10分鐘)</div>`;
            }
            achievementBadgeContainer.innerHTML = badgesHTML;

            gameOverScreen.classList.remove('hidden');
        }

        function startGame(mode) {
            initAudio();
            if (bgmEnabled) startBGM();
            gameMode = mode;
            gameState = 'PLAYING';
            score = 0;
            lives = 3;
            gameTime = 0;
            elapsedSeconds = 0;
            lastBossSpawnMinute = 0;
            triggeredScoreBosses = { 100: false, 1500: false, 2000: false, 2500: false };
            highScore = parseInt(localStorage.getItem('space_shooter_high')) || 0;
            player = new Player();
            bullets = [];
            homingMissiles = [];
            enemies = [];
            classicBosses = [];
            enemyBullets = [];
            particles = [];
            initStars();
            resizeCanvas();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            if (gameMode === 'CLASSIC') {
                quizHud.classList.add('hidden');
                classicMenuBtn.classList.remove('hidden');
            } else {
                quizHud.classList.remove('hidden');
                classicMenuBtn.classList.remove('hidden');
                currentStage = 1;
                questionIndex = 0;
                initSessionQuestions();
                boss = new QuizBoss();
                boss.maxHp = 5;
                boss.hp = 5;
                loadQuestion();
            }
            updateHUD();
        }

        startClassicBtn.addEventListener('click', () => startGame('CLASSIC'));
        startQuizBtn.addEventListener('click', () => startGame('QUIZ'));
        restartBtn.addEventListener('click', () => startGame(gameMode));
        menuBtn.addEventListener('click', returnToMenu);
        classicMenuBtn.addEventListener('click', returnToMenu);

        function returnToMenu() {
            gameState = 'START';
            stopBGM();
            quizHud.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            classicMenuBtn.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let bgConfig = shopData.backgrounds.find(b => b.id === currentBg);
            let gradColors = bgConfig ? bgConfig.gradient : ['#101026', '#020208'];
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, gradColors[0]);
            bgGrad.addColorStop(1, gradColors[1]);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1.0;

            if (gameState === 'PLAYING') {
                gameTime++;
                if (gameTime % 60 === 0) {
                    elapsedSeconds++;
                    let mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                    let secs = String(elapsedSeconds % 60).padStart(2, '0');
                    timeValEl.textContent = `${mins}:${secs}`;

                    if (gameMode === 'CLASSIC') {
                        let currentMinute = Math.floor(elapsedSeconds / 60);
                        if (currentMinute > lastBossSpawnMinute && classicBosses.length === 0) {
                            lastBossSpawnMinute = currentMinute;
                            classicBosses.push(new ClassicMiniBoss());
                        }
                    }
                }

                if (player) {
                    player.update();
                    player.draw();
                }

                if (gameMode === 'CLASSIC') {
                    [100, 1500, 2000, 2500].forEach(threshold => {
                        if (score >= threshold && !triggeredScoreBosses[threshold] && classicBosses.length === 0) {
                            triggeredScoreBosses[threshold] = true;
                            classicBosses.push(new ClassicMiniBoss());
                        }
                    });

                    if (Math.random() < 0.035) {
                        enemies.push(new UFOEnemy());
                    }

                    for (let i = classicBosses.length - 1; i >= 0; i--) {
                        let cb = classicBosses[i];
                        cb.update();
                        cb.draw();

                        if (player && cb.x < player.x + player.width && cb.x + cb.width > player.x &&
                            cb.y < player.y + player.height && cb.y + cb.height > player.y) {
                            SoundFX.playHit();
                            createExplosion(player.x + player.width/2, player.y + player.height/2, '#ef4444');
                            lives--;
                            updateHUD();
                            if (lives <= 0) gameOver();
                        }

                        for (let j = bullets.length - 1; j >= 0; j--) {
                            let b = bullets[j];
                            if (b && b.x < cb.x + cb.width && b.x + b.width > cb.x &&
                                b.y < cb.y + cb.height && b.y + b.height > cb.y) {
                                createExplosion(b.x, b.y, '#f59e0b');
                                bullets.splice(j, 1);
                                cb.hp--;
                                if (cb.hp <= 0) {
                                    createExplosion(cb.x + cb.width/2, cb.y + cb.height/2, '#ef4444');
                                    classicBosses.splice(i, 1);
                                    score += 1000;
                                    updateHUD();
                                }
                                break;
                            }
                        }
                    }

                    for (let i = enemyBullets.length - 1; i >= 0; i--) {
                        let eb = enemyBullets[i];
                        if (eb) {
                            eb.update();
                            eb.draw();

                            if (player && player.invulnerableTimer <= 0 &&
                                eb.x < player.x + player.width && eb.x + eb.width > player.x &&
                                eb.y < player.y + player.height && eb.y + eb.height > player.y) {
                                SoundFX.playHit();
                                createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#ef4444');
                                enemyBullets.splice(i, 1);
                                lives--;
                                player.invulnerableTimer = 60;
                                updateHUD();
                                if (lives <= 0) gameOver();
                                continue;
                            }

                            if (eb.y > canvas.height + 20) {
                                enemyBullets.splice(i, 1);
                            }
                        }
                    }

                    for (let i = enemies.length - 1; i >= 0; i--) {
                        let en = enemies[i];
                        en.update();
                        en.draw();

                        if (player && player.x < en.x + en.width && player.x + player.width > en.x &&
                            player.y < en.y + en.height && player.y + player.height > en.y) {
                            SoundFX.playHit();
                            createExplosion(en.x + en.width/2, en.y + en.height/2, '#ef4444');
                            enemies.splice(i, 1);
                            lives--;
                            updateHUD();
                            if (lives <= 0) gameOver();
                            continue;
                        }

                        if (en.y > canvas.height + 50) {
                            enemies.splice(i, 1);
                            continue;
                        }

                        for (let j = bullets.length - 1; j >= 0; j--) {
                            let b = bullets[j];
                            if (b && b.x < en.x + en.width && b.x + b.width > en.x &&
                                b.y < en.y + en.height && b.y + b.height > en.y) {
                                createExplosion(b.x, b.y, '#f59e0b');
                                bullets.splice(j, 1);
                                en.hp--;
                                if (en.hp <= 0) {
                                    createExplosion(en.x + en.width/2, en.y + en.height/2, '#ef4444');
                                    enemies.splice(i, 1);
                                    score += 150;
                                    updateHUD();
                                }
                                break;
                            }
                        }
                    }
                } else {
                    if (boss) {
                        boss.update();
                        boss.draw();
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.update();
                    b.draw();
                    if (b.y < -20) bullets.splice(i, 1);
                }

                for (let i = homingMissiles.length - 1; i >= 0; i--) {
                    let hm = homingMissiles[i];
                    let reached = hm.update();
                    hm.draw();
                    if (reached) {
                        homingMissiles.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        window.onload = function() {
            initStars();
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
